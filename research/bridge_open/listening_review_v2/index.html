<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blinded listening review v2</title>
<style>
body{font:16px system-ui,sans-serif;max-width:1000px;margin:0 auto;padding:1rem;color:#202124;background:#fafafa}h1{font-size:1.45rem}.bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.7rem 0}.panel,.card{background:white;border:1px solid #d8d8d8;border-radius:8px;padding:1rem;margin:.8rem 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.8rem}.card h2{font-size:1rem;margin-top:0}.card pre{white-space:pre-wrap;min-height:4rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.7rem}label{display:block;font-weight:600}select,textarea,button{font:inherit}select,textarea{width:100%;padding:.35rem;margin-top:.25rem}textarea{min-height:5rem}button{padding:.45rem .8rem;cursor:pointer}.muted{color:#666;font-size:.9rem}audio{width:100%}.status{font-weight:700}
</style>
</head>
<body>
<h1>Blinded listening and reference review</h1>
<p class="muted">Review one item at a time. The labels are anonymous and may differ for every item. Do not infer identity from ordering.</p>
<div class="bar"><button id="prev">Previous</button><button id="next">Next</button><span id="progress"></span><span id="status" class="status">UNREVIEWED</span><button id="downloadJson">Download JSON</button><button id="downloadCsv">Download CSV</button></div>
<main id="app"><p>Loading local packet…</p></main>
<script>
'use strict';
const PACKET_VERSION='20260924-50-v2-ui3', STORAGE_KEY='blinded-listening-review-v2-ui3';
const state={items:[],index:0,responses:{},fingerprint:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const options=(values,selected)=>'<option value="">Select…</option>'+values.map(x=>`<option value="${x}" ${selected===x?'selected':''}>${x}</option>`).join('');
function blank(){return {reference_correct:'',audio_quality:'',notes:'',language_correct_by_system:{},script_correct_by_system:{},meaning_preserved_by_system:{}};}
function currentResponse(){return state.responses[state.items[state.index].review_id]||blank();}
function statusFor(item,r){const any=!!(r.reference_correct||r.audio_quality||r.notes||Object.values(r.language_correct_by_system||{}).some(Boolean)||Object.values(r.script_correct_by_system||{}).some(Boolean)||Object.values(r.meaning_preserved_by_system||{}).some(Boolean));const complete=!!r.reference_correct&&!!r.audio_quality&&item.systems.every(c=>r.language_correct_by_system[c.system_label]&&r.script_correct_by_system[c.system_label]&&r.meaning_preserved_by_system[c.system_label]);return complete?'REVIEWED':any?'IN_PROGRESS':'UNREVIEWED';}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:PACKET_VERSION,fingerprint:state.fingerprint,index:state.index,responses:state.responses}));}catch(e){}}
function restore(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(x&&x.version===PACKET_VERSION&&x.fingerprint===state.fingerprint){state.responses=x.responses||{};state.index=Math.min(x.index||0,state.items.length-1);}}catch(e){}}
function capture(){const item=state.items[state.index],r={...currentResponse(),language_correct_by_system:{},script_correct_by_system:{},meaning_preserved_by_system:{}};r.reference_correct=document.querySelector('#reference_correct').value;r.audio_quality=document.querySelector('#audio_quality').value;r.notes=document.querySelector('#notes').value;item.systems.forEach(c=>{r.language_correct_by_system[c.system_label]=document.querySelector('#language_'+c.system_label).value;r.script_correct_by_system[c.system_label]=document.querySelector('#script_'+c.system_label).value;r.meaning_preserved_by_system[c.system_label]=document.querySelector('#meaning_'+c.system_label).value;});state.responses[item.review_id]=r;persist();updateStatus();}
function updateStatus(){const item=state.items[state.index];document.querySelector('#status').textContent=statusFor(item,currentResponse());}
function scriptHint(language){return language==='hi'?'Devanagari':'Bengali–Assamese script';}
function render(){const item=state.items[state.index],r=currentResponse();document.querySelector('#progress').textContent=`Item ${state.index+1} of ${state.items.length} · ${item.language}`;document.querySelector('#app').innerHTML=`<section class="panel"><div class="muted">${esc(item.review_id)} · ${esc(item.selection_kinds.join(' + '))}</div><audio controls preload="none" src="${esc(item.audio_url)}"></audio><h2>Reference</h2><p>Does this reference match the spoken audio?</p><p>${esc(item.reference_text)}</p></section><section class="cards">${item.systems.map(c=>`<article class="card"><h2>${esc(c.system_label)}</h2><pre>${esc(c.transcript)}</pre><label>Correct language, regardless of script?<select id="language_${c.system_label}">${options(['yes','no','uncertain'],r.language_correct_by_system[c.system_label])}</select></label><label>Uses the expected script (${esc(scriptHint(item.language))})?<select id="script_${c.system_label}">${options(['yes','no','uncertain'],r.script_correct_by_system[c.system_label])}</select></label><label>Meaning preserved for this transcript<select id="meaning_${c.system_label}">${options(['yes','partly','no','uncertain'],r.meaning_preserved_by_system[c.system_label])}</select></label></article>`).join('')}</section><section class="panel"><h2>Review form</h2><div class="grid"><label>Reference matches spoken audio?<select id="reference_correct">${options(['yes','no','uncertain'],r.reference_correct)}</select></label><label>Audio quality<select id="audio_quality">${options(['clear','usable','unclear'],r.audio_quality)}</select></label></div><label>Notes<textarea id="notes">${esc(r.notes)}</textarea></label><button id="save">Save this item locally</button></section><section class="panel"><h2>Rubric</h2><p>Reference correctness: judge whether the displayed reference matches the spoken audio, including its words and content. For each transcript, judge language independent of script, expected script, and whether meaning is preserved; use partly for a material omission or distortion. Audio quality: mark unclear when the recording prevents a fair judgment.</p></section>`;document.querySelectorAll('select,textarea').forEach(x=>x.addEventListener('change',capture));document.querySelector('#notes').addEventListener('input',capture);document.querySelector('#save').onclick=capture;updateStatus();}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function packetFingerprint(items){let h=2166136261;for(const ch of items.map(i=>i.review_id+'|'+i.audio_sha256+'|'+i.reference_sha256).join('|')){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return (h>>>0).toString(16)}
function exportRows(){return state.items.map(i=>{const r=state.responses[i.review_id]||blank();return {review_id:i.review_id,language:i.language,reference_correct:r.reference_correct,audio_quality:r.audio_quality,notes:r.notes,review_status:statusFor(i,r),systems:i.systems.map(c=>({system_label:c.system_label,language_correct:r.language_correct_by_system[c.system_label]||'',script_correct:r.script_correct_by_system[c.system_label]||'',meaning_preserved:r.meaning_preserved_by_system[c.system_label]||''}))}})}
document.querySelector('#prev').onclick=()=>{capture();state.index=Math.max(0,state.index-1);render()};document.querySelector('#next').onclick=()=>{capture();state.index=Math.min(state.items.length-1,state.index+1);render()};document.querySelector('#downloadJson').onclick=()=>{capture();download('listening_review_responses.json',JSON.stringify(exportRows(),null,2),'application/json')};document.querySelector('#downloadCsv').onclick=()=>{capture();const rows=[['review_id','language','reference_correct','system_label','language_correct','script_correct','meaning_preserved','audio_quality','notes','review_status']];exportRows().forEach(x=>x.systems.forEach(s=>rows.push([x.review_id,x.language,x.reference_correct,s.system_label,s.language_correct,s.script_correct,s.meaning_preserved,x.audio_quality,x.notes,x.review_status])));download('listening_review_responses.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n')+'\n','text/csv')};
fetch('review_items.json').then(r=>r.json()).then(x=>{state.items=x;state.fingerprint=packetFingerprint(x);restore();render()}).catch(e=>{document.querySelector('#app').innerHTML='<p>Could not load review_items.json. Serve this directory over HTTP.</p>'});
</script>
</body>
</html>
